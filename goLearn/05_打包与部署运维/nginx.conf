# ==============================================================================
# 🌐 Nginx 生产反向代理与前端静态资源配置模板
# ==============================================================================

events {
    worker_connections 10240; # 单 worker 最大连接数
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # 开启 Gzip 极速压缩
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;

    # 后端 Go 服务集群上游 (可轻松做负载均衡)
    upstream go_backend_cluster {
        server 127.0.0.1:8080 weight=1 max_fails=2 fail_timeout=10s;
        # server 127.0.0.1:8081 weight=1; # 支持增加多实例水平扩展
        keepalive 32; # 保持长连接池
    }

    server {
        listen 80;
        server_name api.yourdomain.com localhost;

        # 1. 前端 Vue / React 打包产物静态托管
        location / {
            root   /var/www/dist;
            index  index.html index.htm;
            # 解决前端 Vue Router / React Router History 路由模式 404 问题
            try_files $uri $uri/ /index.html;
        }

        # 2. 静态资源长久强缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            root /var/www/dist;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 3. 后端 Go API 反向代理
        location /api/ {
            proxy_pass http://go_backend_cluster;

            # 穿透透传客户端真实 IP 和协议
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 开启 HTTP/1.1 长连接支持
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 支持 WebSocket 双向协议升级
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 代理超时控制
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 4. 健康检查探针
        location /health {
            proxy_pass http://go_backend_cluster/health;
        }
    }
}

